name: "Publish Docs to Confluence"
description: "Publishes Markdown documentation to Confluence Cloud with folder hierarchy"
author: "SevendosHQ"

inputs:
  confluence-url:
    description: "Confluence base URL (e.g., https://yourcompany.atlassian.net)"
    required: true
  confluence-user:
    description: "Confluence user email"
    required: true
  confluence-token:
    description: "Confluence API token"
    required: true
  space-key:
    description: "Confluence space key (e.g., DOCS, TECH)"
    required: true
  docs-path:
    description: "Path to documentation folder"
    required: false
    default: "docs"
  root-page-title:
    description: "Title of the root page in Confluence"
    required: false
    default: "Documentation"
  confluence-prefix:
    description: "Optional prefix prepended to all page titles (e.g. '[MyRepo] '). Prevents name collisions when multiple pipelines publish to the same space."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.x"

    - name: Install uv
      shell: bash
      run: pip install uv --quiet

    - name: Install dependencies
      shell: bash
      run: uv pip install --system -r ${{ github.action_path }}/requirements.txt

    - name: Install mermaid CLI (mmdc)
      shell: bash
      run: |
        # Install mmdc globally via npm. Node.js is pre-installed on ubuntu-latest.
        # Puppeteer (used by mmdc) needs a Chromium sandbox config on Linux.
        npm install -g @mermaid-js/mermaid-cli --silent
        # Verify installation
        mmdc --version

    - name: Test Confluence connection
      shell: bash
      env:
        CONFLUENCE_URL: ${{ inputs.confluence-url }}
        CONFLUENCE_USER: ${{ inputs.confluence-user }}
        CONFLUENCE_API_TOKEN: ${{ inputs.confluence-token }}
        CONFLUENCE_SPACE_KEY: ${{ inputs.space-key }}
      run: |
        python - <<'EOF'
        import os
        import sys
        import warnings

        from atlassian import ConfluenceV2

        # ConfluenceV2 warns that *V1 methods* are deprecated on construction.
        # We only use V2 methods, so silence this specific noise.
        warnings.filterwarnings(
            "ignore",
            message="V1 methods are deprecated in ConfluenceCloud.*",
            category=DeprecationWarning,
        )

        # ConfluenceV2 is cloud-only — no `cloud=True` flag.
        conf = ConfluenceV2(
            url=os.environ['CONFLUENCE_URL'],
            username=os.environ['CONFLUENCE_USER'],
            password=os.environ['CONFLUENCE_API_TOKEN'],
        )

        # Test connection using the v2 space API.
        try:
            space = conf.get_space_by_key(os.environ['CONFLUENCE_SPACE_KEY'])
            if not isinstance(space, dict) or 'name' not in space:
                raise RuntimeError(f"Unexpected space response (not JSON dict): {space!r}")
            print(f"✓ Successfully connected to space: {space['name']}")
            print(f"  Space key: {space['key']}")
            print(f"  Space URL: {space['_links']['webui']}")
        except Exception as e:
            # Surface the real error instead of a misleading generic message.
            print(f"✗ Failed to connect to Confluence space: {type(e).__name__}: {e}")
            resp = getattr(e, "response", None)
            if resp is not None:
                try:
                    print(f"  HTTP {resp.status_code} — {resp.text[:300]}")
                except Exception:
                    pass
            sys.exit(1)
        EOF

    - name: Publish to Confluence
      shell: bash
      env:
        CONFLUENCE_URL: ${{ inputs.confluence-url }}
        CONFLUENCE_USER: ${{ inputs.confluence-user }}
        CONFLUENCE_API_TOKEN: ${{ inputs.confluence-token }}
        CONFLUENCE_SPACE_KEY: ${{ inputs.space-key }}
        DOCS_PATH: ${{ inputs.docs-path }}
        ROOT_PAGE_TITLE: ${{ inputs.root-page-title }}
        CONFLUENCE_PREFIX: ${{ inputs.confluence-prefix }}
      run: python ${{ github.action_path }}/publish.py

branding:
  icon: "book-open"
  color: "blue"
